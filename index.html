<html>
<head>
  <title>Apolion Games: Antonio's Resume</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body style="height: 100%;width: 100%;">
  <div class="main">
    <div class="mainContainer">
      <div class="mainCont">
        <div class="name">
          <p>Antonio A. Tapia Maldonado</p>
        </div>
        <div class="divisions">
          <div id="experience" class="oval division">
            <p>Experience</p>
          </div>
          <div id="education" class="oval division">
            <p>Education and Certifications</p>
          </div>
          <div id="projects" class="oval division">
            <p>Projects</p>
          </div>
          <div id="skills" class="oval division">
            <p>Skills</p>
          </div>
        </div>
        <div class="scrollviewOfDetails">   
          <div id="scrollviewOfDetailsId" class="content scrollviewOfDetailsClose">
            <button id="scrollviewOfDetailsClose" class="close-btn">&times;Close</button>
            <div id="scrollviewOfDetailsContent">
            </div>
          </div>
        </div>
        <div class="playButtonContainer">
          <div id="playButton" class="playButton oval">
            <p>Play</p>
          </div>
        </div>
      </div>
    </div>
  </div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/main.js"></script>
</body>
</html>
